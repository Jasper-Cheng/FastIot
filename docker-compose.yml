# MySQL 使用已有容器（如 mysql-iot，宿主机端口 3336），不在此 compose 中创建
services:
  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: fastiot_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - fastiot_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 10s
      retries: 5

  # RabbitMQ 消息队列服务
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastiot_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fastiot_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 30s
      retries: 5

  # FastAPI 应用服务
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastiot_app
    restart: unless-stopped
    ports:
      - "${PORT}:8000"
    env_file:
      - .env
    # MySQL 连已有容器：宿主机 3336 -> mysql-iot；MQTT 等也通过宿主机
    environment:
      MYSQL_HOST: host.docker.internal
      MYSQL_PORT: "3336"
      DATABASE_URL: mysql+aiomysql://${MYSQL_USER}:${MYSQL_PASSWORD}@host.docker.internal:3336/${MYSQL_DB}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - fastiot_network

volumes:
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  fastiot_network:
    driver: bridge
