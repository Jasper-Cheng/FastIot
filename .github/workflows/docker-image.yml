name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - test
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Determine environment and image name
        id: env
        run: |
          # 确定环境
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            ENVIRONMENT="production"
            REPOSITORY="${{ secrets.Docker_REPOSITORY }}"
          elif [[ "${GITHUB_REF}" == refs/heads/test ]]; then
            ENVIRONMENT="test"
            REPOSITORY="${{ secrets.Docker_REPOSITORY_TEST }}"
          else
            ENVIRONMENT="production"  # 标签推送默认使用生产环境
            REPOSITORY="${{ secrets.Docker_REPOSITORY }}"
          fi
          
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "repository=${REPOSITORY}" >> $GITHUB_OUTPUT

      - name: Generate Docker tags
        id: tags
        run: |
          IMAGE_NAME="${{ steps.env.outputs.repository }}"
          ENVIRONMENT="${{ steps.env.outputs.environment }}"
          
          # 基础标签：环境标签
          TAGS="${IMAGE_NAME}:${ENVIRONMENT}"
          
          # 如果是 main 分支推送，添加 latest 标签
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS="${TAGS},${IMAGE_NAME}:latest"
          fi
          
          # 如果是标签推送，添加版本标签
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}  # 移除 v 前缀
            TAGS="${TAGS},${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:${VERSION}-${ENVIRONMENT}"
          fi
          
          # 添加提交哈希标签
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAGS="${TAGS},${IMAGE_NAME}:${SHORT_SHA},${IMAGE_NAME}:${SHORT_SHA}-${ENVIRONMENT}"
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.Docker_USERNAME }}
          password: ${{ secrets.Docker_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            ENVIRONMENT=${{ steps.env.outputs.environment }}

      - name: Log push information
        run: |
          echo "Environment: ${{ steps.env.outputs.environment }}"
          echo "Repository: ${{ steps.env.outputs.repository }}"
          echo "Tags: ${{ steps.tags.outputs.tags }}"
