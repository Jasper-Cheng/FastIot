name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  # 支持在 Actions 页面手动触发构建
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Docker tags
        id: tags
        run: |
          IMAGE_NAME="${{ secrets.Docker_REPOSITORY }}"
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          # 可变 tag（跟随最新 main），用于测试环境
          TAGS="${IMAGE_NAME}:main"
          # 不可变 tag（提交 SHA），用于生产发布与回滚
          TAGS="${TAGS},${IMAGE_NAME}:${SHORT_SHA}"

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.Docker_USERNAME }}
          password: ${{ secrets.Docker_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log push information
        run: |
          echo "Repository: ${{ secrets.Docker_REPOSITORY }}"
          echo "Tags: ${{ steps.tags.outputs.tags }}"
          echo "Commit SHA: ${GITHUB_SHA:0:7}"
          echo "测试环境: ${{ secrets.Docker_REPOSITORY }}:main"
          echo "生产发布: ${{ secrets.Docker_REPOSITORY }}:${{ steps.tags.outputs.sha }}"
